[project]
name = "mait-dashboard"
version = "0.1.0"
description = "Doover dashboard for a MAIT iNTELLiNet site: pumps, tanks, flow and pivots at a glance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydoover>=1.18.8"]

[project.scripts]
export-config = "mait_dashboard.app_config:export"
export-ui = "mait_dashboard.app_ui:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mait_dashboard"]

[dependency-groups]
dev = ["pytest>=8.3.5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
